name: V2 tests
on:
  push:
    branches: [upgrade-v2]
  pull_request:
    branches: [upgrade-v2]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Flask==3.1.0
      - run: python -m unittest discover -s tests -v
