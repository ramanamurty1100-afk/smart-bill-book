name: V2 tests
on:
  push:
    branches: [upgrade-v2]
  pull_request:
    branches: [upgrade-v2]
jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Flask==3.1.0
      - run: python -m unittest discover -s tests -v

  test-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: billbook
          POSTGRES_PASSWORD: billbook-test-password
          POSTGRES_DB: billbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billbook -d billbook_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://billbook:billbook-test-password@localhost:5432/billbook_test
      SECRET_KEY: test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Flask==3.1.0 psycopg2-binary==2.9.10
      - run: python -m unittest discover -s tests -v
